<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
 
      .container {
        background: #000000;
        padding: 30px;
        width: 320px;
        text-align: center;
        border-radius: 4px;
        border: 1px solid #2f2f2f;
        box-shadow: 0 0 20px rgba(37, 244, 238, 0.15);
      }
 
      h1 {
        color: #ffffff;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
 
      p {
        color: #8a8b91;
        font-size: 14px;
        margin-bottom: 20px;
      }
 
      button {
        width: 100%;
        padding: 12px;
        cursor: pointer;
        background: #fe2c55;
        color: #ffffff;
        border: none;
        border-radius: 2px;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.3px;
        transition: opacity 0.15s ease;
      }
 
      button:hover {
        opacity: 0.85;
      }
 
      button:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to the Dashboard</h1>
 
      <p>You have successfully logged in.</p>
 
      <button onclick="logout()">Logout</button>
    </div>
 
    <script>
      function logout() {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
